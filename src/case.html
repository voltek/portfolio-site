<!doctype html>
<html lang="en" data-world="read">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{@head}}
<script>
  // theme before first paint, as in Plain: the visitor's saved choice, else the system setting (?theme= forces one, for previews)
  document.documentElement.classList.add("js");
  (() => { let t = null; try { t = localStorage.getItem("ah-theme"); if (t !== "dark" && t !== "light") t = null; } catch (e) {}
    const q = new URLSearchParams(location.search).get("theme");
    document.documentElement.dataset.theme = q === "dark" || q === "light" ? q : t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); })();
</script>
<link rel="preload" href="assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<style>
  /* a case study, the Ficha (approved 10-27): Plain's world (tokens.css, world "read"); the cobalt field opens the
     page, paper is where reading happens, --go is the one clickable color. Layout by the data: tools/pages/case.js */
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--paper);color:var(--paper-ink);scrollbar-color:var(--field) var(--paper);scroll-behavior:smooth}
  body{font-family:var(--text);font-size:17px;line-height:1.55;min-height:100vh;caret-color:var(--go);background:var(--paper);color:var(--paper-ink)}
  ::selection{background:var(--select);color:var(--select-ink)}
  /* the ring takes --focus from the surface under it: dark ink on paper, cream on the cobalt field */
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:3px}
  .topbar,.field,.contact{--focus:var(--on-field)}
  a{color:inherit}
  svg{display:block}
  .wrap{width:min(1240px,100% - 32px);margin:0 auto}
  .num{font-variant-numeric:tabular-nums}
  code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.86em;background:var(--cell);padding:.08em .35em;border-radius:3px}
  .skip{position:absolute;left:16px;top:-60px;z-index:30;padding:10px 16px;border-radius:6px;background:var(--sheet);color:var(--paper-ink);font-weight:700;text-decoration:none}
  .skip:focus{top:12px}

{{>bar-read.css}}
  /* ---------- opening: the facts on the left, "At a glance" on a raised sheet ---------- */
  .field{background:var(--field);color:var(--on-field)}
  header.field{padding-bottom:168px}
  header.field.flat{padding-bottom:72px}
  .open{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;padding-top:40px;align-items:start}
  .back{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--on-field);text-decoration:underline;text-decoration-color:var(--go-line);text-decoration-thickness:2px;text-underline-offset:5px}
  .back:hover{text-decoration-thickness:3px}
  .back svg{width:16px;height:16px}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(52px,7.4vw,96px);line-height:.92;letter-spacing:-.035em;margin-top:22px}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:24px;font-size:15px;font-weight:600;color:var(--on-field-2)}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;border:1px solid var(--field-rule);border-radius:999px;padding:3px 11px;white-space:nowrap;color:var(--on-field)}
  .chip i{width:8px;height:8px;border-radius:50%;flex:none}
  .lede{margin-top:20px;font-size:clamp(18px,1.5vw,21px);line-height:1.5;max-width:46ch}
  .role{margin-top:14px;font-size:16px;color:var(--on-field-2)}
  .links{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px}
  .tlink{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:15px;color:var(--on-field);text-decoration:underline;text-decoration-color:var(--go-line);text-decoration-thickness:2px;text-underline-offset:5px}
  .tlink:hover{text-decoration-thickness:3px}
  .tlink svg{width:16px;height:16px}
  .sheet{background:var(--sheet);color:var(--paper-ink);border:1px solid var(--sheet-line);border-radius:6px;box-shadow:var(--lift);--rule:var(--rule-raised);--cell:var(--cell-raised);--focus:var(--paper-ink)}
  .sheet .bar{padding:12px 20px;border-bottom:1px solid var(--rule)}
  .sheet .bar h2{font-family:var(--text);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--paper-muted);line-height:1.4}
  .sheet .body{padding:6px 20px 20px}
  .hl{list-style:none}
  .hl li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:16px;line-height:1.45;font-weight:600}
  .hl svg{width:20px;height:20px;color:var(--own);margin-top:2px}
  .stk{margin-top:16px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--paper-muted)}
  .facts{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin-top:8px}
  .facts li{font-size:14px;font-weight:600;padding:4px 11px;border-radius:4px;background:var(--cell);line-height:1.35}

  /* ---------- the strip: straddles the field's edge; swipes on a phone, arrows where it overflows on desktop ---------- */
  .strip{position:relative;width:min(1240px,100% - 32px);margin:-132px auto 0}
  .track{display:flex;gap:36px;overflow-x:auto;scroll-snap-type:x mandatory;justify-content:safe center;padding:4px 4px 14px;scrollbar-width:none;overscroll-behavior-x:contain}
  .track::-webkit-scrollbar{display:none}
  .track:focus-visible{outline-offset:6px}
  .it{flex:0 0 196px;scroll-snap-align:center;text-align:center;position:relative}
  .it figcaption{font-size:14px;font-weight:700;margin-top:10px}
  .phone{display:block;aspect-ratio:9/20.2;border-radius:22px;background:var(--screen);padding:5px;box-shadow:var(--lift);position:relative}
  .phone img,.phone video{width:100%;height:100%;border-radius:18px;object-fit:cover;object-position:top;display:block}
  .shot{all:unset;display:block;cursor:zoom-in;border-radius:22px;transition:transform var(--t)}
  .shot:hover{transform:translateY(-4px)}
  .shot:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
  .sbtn{position:absolute;top:calc(50% - 40px);z-index:2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--paper-muted);background:var(--sheet);color:var(--paper-ink);cursor:pointer;box-shadow:var(--lift)}
  .sbtn[hidden]{display:none}
  .sbtn:hover{border-color:var(--paper-ink)}
  .sbtn:disabled{opacity:.4;cursor:default}
  .sbtn svg{width:18px;height:18px}
  .prev{left:-6px}.next{right:-6px}
  .shotnote{text-align:center;font-size:14px;color:var(--paper-muted);margin-top:4px}
  /* the viewer: a dark veil in both themes, so its ink is fixed cream */
  .lb{margin:auto;border:0;background:none;max-width:min(440px,92vw);max-height:96vh;overflow:visible}
  .lb::backdrop{background:rgba(5,10,30,.82)}
  .lb figure{display:flex;flex-direction:column;align-items:center;touch-action:pan-y}
  .lb img{max-height:84vh;width:auto;max-width:100%;border-radius:20px;border:5px solid var(--screen)}
  .lb figcaption{margin-top:10px;color:#F4EFE6;font-weight:700}
  .lbx{position:absolute;top:-6px;right:-52px;color:#F4EFE6;border-color:rgba(244,239,230,.5);--focus:#F4EFE6}
  .lbn{position:absolute;top:calc(42% - 22px);z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(244,239,230,.5);background:rgba(5,10,30,.55);color:#F4EFE6;cursor:pointer;--focus:#F4EFE6}
  .lbn:hover,.lbx:hover{border-color:var(--go)}
  .lbn svg{width:18px;height:18px}
  .lbp{left:-64px}.lbf{right:-64px}

  /* ---------- sections: Plain's .head (title 4 / text 8) ---------- */
  main > .wrap > section{padding-top:96px}
  .head{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:48px;align-items:end;padding-bottom:20px;border-bottom:2px solid var(--head-rule)}
  h2{font-family:var(--display);font-weight:800;font-size:clamp(32px,3.6vw,48px);letter-spacing:-.03em;line-height:1;text-wrap:balance}
  .hash{margin-left:.3em;color:var(--paper-muted);text-decoration:none;opacity:0;font-size:.6em;vertical-align:.3em}
  h2:hover .hash,.hash:focus-visible{opacity:1}
  @media (hover:none){ .hash{opacity:.5} }
  .head p{font-size:18px;line-height:1.6;max-width:62ch}
  .files{display:inline-flex;flex-wrap:wrap;gap:4px 16px;vertical-align:baseline}
  .fl{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--link);text-decoration:underline;text-decoration-color:var(--go-line);text-decoration-thickness:2px;text-underline-offset:4px;overflow-wrap:anywhere}
  .fl svg{width:15px;height:15px;flex:none;color:var(--paper-muted)}
  .fl:hover{text-decoration-thickness:3px}

  /* ---------- the architecture: the data's way to the screen; diagram tokens checked at ≥ 3:1 in both themes ---------- */
  .dg{--r-line:#1F3FBF;--r-no:#1F3FBF;--r-no-ink:#FFFFFF;--r-band:var(--cell);--r-piece:#FFFFFF;--r-edge:#4F5672;--focus:var(--paper-ink)}
  :root[data-theme="dark"] .dg{--r-line:#8FA8FF;--r-no:#8FA8FF;--r-no-ink:#0A1029;--r-band:#161F47;--r-piece:#25306B;--r-edge:#A3AEDB}
  /* the edge columns narrow on mid widths so each name keeps its box; below 1000 px the flow turns vertical */
  .flow{--fe-w:116px;display:grid;grid-template-rows:auto auto auto;margin-top:40px;position:relative}
  .fband{grid-row:1 / 4;background:var(--r-band);border-radius:8px;margin:0 6px}
  .fhead{grid-row:1;padding:16px 20px 14px;position:relative}
  .fhead b{display:block;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.1}
  .fhead code{background:none;padding:0;font-size:13px;color:var(--paper-muted);overflow-wrap:anywhere}
  .fn{grid-row:2;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:1px;margin:0 14px;min-height:64px;padding:10px 14px;border:2px solid var(--r-edge);border-radius:6px;background:var(--r-piece);color:var(--paper-ink);text-decoration:none;line-height:1.25}
  .fn b{font-weight:700;font-size:15.5px}.fn small{font-size:13px;color:var(--paper-muted)}
  .fn:hover b{text-decoration:underline;text-decoration-color:var(--go-line);text-decoration-thickness:2px;text-underline-offset:4px}
  .fn.marked{border-color:var(--r-line);border-width:3px}
  .mk{position:absolute;top:-12px;left:10px;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--r-line);color:var(--r-no-ink);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .fe{grid-row:2;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;align-items:stretch;margin:0 -14px;text-align:center}
  .fe span{font-size:12.5px;font-weight:700;line-height:1.2;color:var(--paper-ink);padding:0 8px 6px}
  .ar{display:block;position:relative;height:3px;background:var(--r-line);margin:0 9px 0 0}
  .ar::after{content:"";position:absolute;right:-9px;top:-5.5px;border-style:solid;border-width:7px 0 7px 10px;border-color:transparent transparent transparent var(--r-line)}
  .ar.left{margin:0 0 0 9px}
  .ar.left::after{right:auto;left:-9px;border-width:7px 10px 7px 0;border-color:transparent var(--r-line) transparent transparent}
  .fs{grid-row:3;position:relative;z-index:1;display:grid;justify-items:center;padding:6px 20px 20px}
  .fs .up{width:3px;height:26px;background:var(--r-line);position:relative}
  .fs .up::before{content:"";position:absolute;top:-6px;left:-5px;border:6.5px solid transparent;border-bottom:8px solid var(--r-line);border-top:0}
  .fs .say{font-size:12.5px;font-weight:700;margin:4px 0 6px;text-align:center;line-height:1.25}
  .fs .fn{grid-row:auto}
  .fn.side{margin:0;width:100%}
  .fb{grid-row:3;position:relative;z-index:1;display:flex;flex-direction:column;align-items:stretch;padding:16px 25% 20px;text-align:center}
  .fb span{font-size:12.5px;font-weight:700;margin-top:3px}
  .vflow{display:none}
  .pin{margin-top:22px;font-size:15px;color:var(--paper-muted)}
  .walk{margin-top:44px;padding-top:18px;border-top:1px solid var(--rule)}
  .walk h3{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin-bottom:6px}
  .walk ol{list-style:none;counter-reset:w;columns:2;column-gap:44px}
  .walk li{break-inside:avoid;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:15.5px;line-height:1.45}
  .walk li::before{counter-increment:w;content:counter(w);grid-row:1 / 3;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--r-no);color:var(--r-no-ink);font:800 13px/1 var(--display)}
  .walk .files{grid-column:2}

  /* ---------- decisions: the full width, five columns ---------- */
  .dtable{margin-top:8px;position:relative}
  .dr{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,2.2fr) minmax(0,3.4fr) minmax(0,2.6fr) minmax(0,2.4fr);gap:24px;padding:20px 0;border-bottom:1px solid var(--rule);font-size:15.5px;line-height:1.5}
  .dr b{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.2;letter-spacing:-.01em}
  .dh{padding:12px 0 10px;border-bottom:2px solid var(--head-rule);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--paper-muted)}
  .dr .files{display:flex;flex-direction:column;gap:6px}

  /* ---------- tests, AI, what's missing ---------- */
  .pair{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:48px;margin-top:8px}
  .items{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
  .items > li{padding:22px 0;border-bottom:1px solid var(--rule);display:grid;gap:10px;align-content:start}
  .items.one{grid-template-columns:minmax(0,1fr)}
  /* the measure: Figtree's "0" is wide, so 58ch is about 80 characters a line */
  .items.one li > span,.items.one .sub{max-width:58ch}
  .sub{display:grid;gap:6px;padding-left:1.2em}
  .items b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.2}
  .prose p{max-width:58ch;padding:22px 0 0}
  .prose .gs{color:var(--link);margin-top:12px}
  .source{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);display:grid;gap:8px;font-size:15px;color:var(--paper-muted)}
  .source .links{margin-top:0}
  .source .tlink{color:var(--link)}
  .source p a{color:inherit;text-decoration-color:var(--go-line);text-decoration-thickness:2px;text-underline-offset:4px}
  .source p a:hover{text-decoration-thickness:3px}

  /* ---------- foot: the way back and the next case, then the landing's contact, as is ---------- */
  .after{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;margin-top:88px;padding:28px 0;border-top:2px solid var(--head-rule)}
  .nextc{display:grid;gap:4px;justify-self:end;justify-items:end;text-align:right;text-decoration:none;max-width:60ch}
  .nextc b{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:clamp(28px,3vw,40px);letter-spacing:-.03em;line-height:1.05;text-decoration:underline;text-decoration-color:var(--go-line);text-decoration-thickness:3px;text-underline-offset:7px}
  .nextc:hover b{text-decoration-thickness:4px}
  .nextc b svg{width:26px;height:26px}
  .nextc small{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--paper-muted)}
  .nextc span{color:var(--paper-muted)}
  /* back and forward weigh the same: "All work" takes the next case's title size (Alan, 10-28) */
  .after .back{gap:10px;color:var(--paper-ink);font-family:var(--display);font-weight:800;font-size:clamp(28px,3vw,40px);letter-spacing:-.03em;line-height:1.05;text-decoration-thickness:3px;text-underline-offset:7px}
  .after .back:hover{text-decoration-thickness:4px}
  .after .back svg{width:26px;height:26px}
{{>contact-read.css}}
  @media (max-width:1240px){ .flow{--fe-w:80px} .fn{margin:0 6px;padding:10px} .fn b{font-size:14.5px} .fe{margin:0 -6px} }
  @media (max-width:1060px){
    .dr{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 28px}
    /* the header row leaves the screen but stays for screen readers, so each cell keeps its column; the label drawn
       above each cell is for the eye only ("/ ''": no second reading) */
    .dh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;padding:0;border:0}
    .dr b{grid-column:1/-1}
    .dr [data-l]::before{content:attr(data-l);content:attr(data-l) / "";display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--paper-muted);margin-bottom:2px}
  }
  /* a phone: the trunk goes down, the layer named where it changes */
  @media (max-width:1000px){
    .flow{display:none}
    .vflow{display:block;list-style:none;margin-top:28px}
    .vflow li{display:grid;justify-items:start}
    .vflow .vl{margin:14px 0 6px;padding-top:12px;border-top:2px solid var(--r-band);font-size:13px;color:var(--paper-muted)}
    .vflow .vl:first-child{margin-top:0;border-top:0;padding-top:0}
    .vflow .vl b{font-family:var(--display);font-size:18px;color:var(--paper-ink)}
    .vflow .vl code{background:none;padding:0}
    .vflow .fn{margin:0;width:100%;grid-row:auto}
    .vflow .vside{margin:8px 0 0 14px;padding-left:12px;border-left:3px solid var(--r-line);font-size:14px;font-weight:600}
    .vflow .vside a{text-decoration-color:var(--go-line);text-underline-offset:3px}
    .vflow .ve{display:flex;align-items:center;gap:10px;padding:8px 0 8px 18px;font-size:13px;font-weight:700}
    .vflow .dn{width:3px;height:30px;background:var(--r-line);position:relative;flex:none}
    .vflow .dn::after{content:"";position:absolute;bottom:-6px;left:-5px;border:6.5px solid transparent;border-top:8px solid var(--r-line);border-bottom:0}
    .vflow .vb{color:var(--paper-muted)}
  }
  @media (max-width:900px){
    .open,.head,.pair{grid-template-columns:minmax(0,1fr);gap:24px}
    .items{grid-template-columns:minmax(0,1fr)}
    .pair > span:empty{display:none}
    .walk ol{columns:1}
    .lbx{right:0;top:-52px}
    .lbp{left:8px}.lbf{right:8px}
  }
  @media (max-width:700px){
    header.field{padding-bottom:120px}
    .strip{margin-top:-96px}
    .track{justify-content:flex-start;gap:18px;padding-left:calc(50% - 31vw);padding-right:calc(50% - 31vw);scroll-padding-inline:calc(50% - 31vw)}
    .it{flex-basis:62vw;max-width:240px}
    .sbtn{display:none}
    .dr{grid-template-columns:minmax(0,1fr)}
    /* a phone keeps back and forward on one row, a step smaller; the next case's line waits for the desktop (Alan, 10-28) */
    .after{gap:16px;align-items:start}
    .after .back,.nextc b{font-size:24px;gap:6px}
    .after .back svg,.nextc b svg{width:20px;height:20px}
    .after .back{margin-top:22px}
    .nextc span{display:none}
  }
  @media (max-width:640px){
    main > .wrap > section{padding-top:72px}
  }
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} .shot:hover{transform:none} }
</style>
</head>
<body>
<a class="skip" href="#main">{{copy.aria.skip}}</a>
<div class="topbar" id="top">
  <div class="wrap">
    <div class="mast">
      <a class="who" href="index.html">{{profile.name}}</a>
      <div class="right">
        <nav aria-label="{{copy.aria.primary}}" id="nav">{{@nav}}</nav>
        <a class="full" href="#contact">{{copy.nav.plain.4}}</a>
        <button class="theme" id="theme" type="button" aria-label="{{copy.aria.toDark}}" data-to-dark="{{copy.aria.toDark}}" data-to-light="{{copy.aria.toLight}}">
          <svg class="sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="currentColor"/><path d="M10 1.5v2.4M10 16.1v2.4M1.5 10h2.4M16.1 10h2.4M4 4l1.7 1.7M14.3 14.3L16 16M4 16l1.7-1.7M14.3 5.7L16 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg class="moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.6A6.5 6.5 0 017.4 4.5a6.5 6.5 0 108.1 8.1z" fill="currentColor"/></svg>
        </button>
        <button class="theme menu" id="menu" type="button" aria-label="{{copy.aria.menu}}" aria-expanded="false" aria-controls="nav"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>
</div>

<main id="main">
<header class="field{{@flat}}" id="overview"><div class="wrap open">
  {{@opening}}
</div></header>

{{@strip}}

<div class="wrap">
  {{@sections}}
  {{@source}}
  {{@after}}
</div>

{{>contact-read.html}}
</main>
{{@live}}
<script>
  const root = document.documentElement, $ = id => document.getElementById(id);
{{>bar-read.js}}

  // "All work" and the name in the bar: back to the exact place on the landing when we came from it (same site; Plain or
  // Show, whichever the visitor was reading); else
  // "All work" goes to the project's card and the name to the landing's top, as a home link does (Alan, 10-28)
  document.querySelectorAll('a[href^="index.html#"], .mast .who').forEach(a => a.addEventListener("click", e => { try {
    const r = document.referrer && new URL(document.referrer);
    if (r && r.origin === location.origin && /(\/|index\.html|show\.html)$/.test(r.pathname) && history.length > 1) { e.preventDefault(); history.back(); }
  } catch (x) {} }));

  // the strip: arrows only when it overflows; a tap opens the larger screen in a dialog
  (() => { const st = document.querySelector(".strip"); if (!st) return;
    const tr = st.querySelector(".track"), prev = st.querySelector(".prev"), next = st.querySelector(".next");
    const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
    const upd = () => { const over = tr.scrollWidth > tr.clientWidth + 2; prev.hidden = next.hidden = !over;
      prev.disabled = tr.scrollLeft < 4; next.disabled = tr.scrollLeft > tr.scrollWidth - tr.clientWidth - 4; };
    const step = d => tr.scrollBy({ left: d * (tr.querySelector(".it").offsetWidth + 36), behavior: calm() });
    prev.addEventListener("click", () => step(-1)); next.addEventListener("click", () => step(1));
    tr.addEventListener("scroll", upd, { passive:true }); new ResizeObserver(upd).observe(tr); upd();
    const lb = document.querySelector(".lb"); if (!lb) return;
    const big = lb.querySelector("img"), cap = lb.querySelector("figcaption"), SHOTS = {{@shotsJson}};
    let cur = 0; const show = i => { cur = (i + SHOTS.length) % SHOTS.length; const s = SHOTS[cur];
      big.src = s.src; big.alt = s.alt; cap.textContent = s.label + " · " + (cur + 1) + " / " + SHOTS.length; };
    st.querySelectorAll(".shot").forEach(b => b.addEventListener("click", () => { show(+b.dataset.i); lb.showModal(); }));
    lb.querySelector(".lbp").addEventListener("click", () => show(cur - 1)); lb.querySelector(".lbf").addEventListener("click", () => show(cur + 1));
    lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") { e.preventDefault(); show(cur - 1); } if (e.key === "ArrowRight") { e.preventDefault(); show(cur + 1); } });
    // a swipe on the screen moves too (a phone has no arrow keys)
    let x0 = null; const fig = lb.querySelector("figure");
    fig.addEventListener("pointerdown", e => { x0 = e.clientX; });
    fig.addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); });
    lb.querySelector(".lbx").addEventListener("click", () => lb.close());
    // closing returns focus to the screen being viewed, not the one that opened the viewer
    lb.addEventListener("close", () => { const b = st.querySelector('.shot[data-i="' + cur + '"]'); if (b) setTimeout(() => b.focus({ preventScroll:true })); });
    lb.addEventListener("click", e => { if (e.target === lb) lb.close(); }); })();

{{>copy-email.js}}</script>
</body>
</html>
